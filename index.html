<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Konk</title>
  <style>
    :root { --bg:#14291f; --fg:#fdf6e3; --gold:#e8c35a; --red:#c8323c; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; text-align:center;
           background:var(--bg); color:var(--fg); font-family:system-ui,sans-serif; padding:16px; }
    h1 { font-size:clamp(2.5rem,10vw,5rem); margin:0; color:var(--gold); }
    p { font-size:1.2rem; }
    .pill { display:inline-block; background:var(--red); padding:.4em 1em; border-radius:999px; }
  </style>
</head>
<body>
  <main>
    <h1>🎄 Konk</h1>
    <p>Julebrustest og andre konkurranser kommer snart.</p>
    <span class="pill">Under bygging</span>
  </main>
</body>
</html>
